<!DOCTYPE html>
<!-- Renaissance — Espace de travail Yanis BGH.
     Habillage : « Dashboard / Admin Panel » de Jacek Dunikowski (licence MIT),
     https://codepen.io/jaca90/pen/vZJZMx — CSS repris à l'identique, la largeur
     réduite de la barre étant portée de 70 px à 19 px (≈ 0,5 cm). -->
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Cache-Control" content="no-store">
<title>Renaissance — Espace de travail</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
@import url("https://fonts.googleapis.com/css?family=Open+Sans:300,400,400i,600,700&subset=latin-ext");

:root{
  --sidebarReducedWidth:54px;      /* la barre fermée laisse voir les icônes */
  --sidebarExpandedWidth:220px;
  --main-color:#102c58;
  --text-color:#ababab;
  --light-blue:#5f9cfd;
  --red:#f91605;
  --navy:#051835;
  --bg-color-light:#f3f3f3;
  --orange:#f5642d;
  --light-grey:#d0d0d0;
  --header-color:#ffffff;
  --green:#1f9d55;
  --gold:#a07f43;
}

html,body{height:100%;width:100%;}
body{margin:0;padding:0;font-family:"Open Sans",system-ui,sans-serif;font-size:14px;font-weight:400;
  overflow:hidden;background-color:var(--bg-color-light);color:var(--main-color);}
*{-webkit-box-sizing:border-box;-moz-box-sizing:border-box;box-sizing:border-box;}
::-webkit-input-placeholder{color:#c3c3c3;}
p{color:var(--text-color);}
h1{font-size:24px;} h2{font-size:20px;} h3{font-size:18px;}

.u-list{margin:0;padding:0;list-style:none;}
.u-input{outline:0;border:1px solid var(--light-grey);padding:5px 10px;height:35px;font-size:12px;
  border-radius:10px;background-clip:padding-box;}

.c-badge{font-size:10px;font-weight:700;min-width:20px;padding:5px;border-radius:4px;display:block;
  line-height:.7;color:#fff;text-align:center;white-space:nowrap;background-color:var(--main-color);border:1px solid #0c2142;}
.c-badge--blue{background-color:var(--light-blue);border:1px solid #468cfd;}

/* ── Hamburger : animation d'origine ─────────────────────────────────────── */
.hamburger-toggle{position:relative;padding:0;background:transparent;border:1px solid transparent;cursor:pointer;order:1;}
.hamburger-toggle [class*=bar-]{display:block;background:var(--main-color);
  -webkit-transform:rotate(0deg);transform:rotate(0deg);
  -webkit-transition:.2s ease all;transition:.2s ease all;
  border-radius:2px;height:2px;width:24px;margin-bottom:4px;}
.hamburger-toggle [class*=bar-]:nth-child(2){width:18px;}
.hamburger-toggle [class*=bar-]:last-child{margin-bottom:0;width:12px;}
.hamburger-toggle.is-opened{left:3px;}
.hamburger-toggle.is-opened .bar-top{-webkit-transform:rotate(45deg);transform:rotate(45deg);
  -webkit-transform-origin:15% 15%;transform-origin:15% 15%;}
.hamburger-toggle.is-opened .bar-mid{opacity:0;}
.hamburger-toggle.is-opened .bar-bot{-webkit-transform:rotate(-45deg);transform:rotate(-45deg);
  -webkit-transform-origin:15% 95%;transform-origin:15% 95%;width:24px;}
.hamburger-toggle:focus{outline-width:0;}

.header-icons-group{display:flex;order:3;margin-left:auto;height:100%;border-left:1px solid #cccccc;}
.header-icons-group .c-header-icon:last-child{border-right:0;}

.c-header-icon{position:relative;display:flex;flex-shrink:0;float:left;width:70px;height:100%;
  align-items:center;justify-content:center;line-height:1;cursor:pointer;border-right:1px solid #cccccc;}
.c-header-icon i{font-size:18px;line-height:40px;}
.c-header-icon:hover i{color:var(--orange);}
.c-header-icon:hover [class*=bar-]{background:var(--orange);}

.l-header{padding-left:var(--sidebarReducedWidth);position:fixed;top:0;right:0;z-index:10;width:100%;
  background:var(--header-color);-webkit-transition:padding .5s ease-in-out;transition:padding .5s ease-in-out;}
.l-header__inner{height:70px;width:100%;display:flex;align-items:center;justify-content:stretch;
  border-bottom:1px solid;border-color:#cccccc;}
.sidebar-is-expanded .l-header{padding-left:var(--sidebarExpandedWidth);}

.c-search{display:flex;flex-grow:1;height:100%;}
.c-search__input{border-top-right-radius:0;border-bottom-right-radius:0;border-right:0;width:100%;height:100%;
  border:0;font-size:14px;padding:0 20px;-webkit-transition:all .3s ease-in-out;transition:all .3s ease-in-out;}
.c-search__input:focus{outline:0;background:#fafbfd;}

.page-name{display:flex;align-items:center;padding:0 18px;font-size:15px;font-weight:600;white-space:nowrap;order:2;}

/* ── Barre latérale ──────────────────────────────────────────────────────── */
.l-sidebar{width:var(--sidebarReducedWidth);position:absolute;z-index:10;left:0;top:0;bottom:0;
  background:var(--main-color);overflow:hidden;
  -webkit-transition:width .5s ease-in-out;transition:width .5s ease-in-out;}
.l-sidebar .logo{width:var(--sidebarExpandedWidth);height:70px;display:flex;align-items:center;
  justify-content:center;background-color:var(--navy);}
.l-sidebar .logo .logo__txt{font-size:17px;line-height:1;color:#fff;text-align:center;font-weight:700;
  letter-spacing:3px;white-space:nowrap;}
.l-sidebar__content{height:100%;position:relative;}
.sidebar-is-expanded .l-sidebar{width:var(--sidebarExpandedWidth);}

/* Poignée en haut de la barre : ouvre ET ferme, dans les deux états.
   Une lisière invisible sur toute la hauteur aurait bloqué les clics sur
   les icônes lorsque la barre est fermée. */
.l-sidebar .logo{cursor:pointer;justify-content:flex-start;padding-left:0;}
.l-sidebar .logo:hover{background-color:#0a2450;}
.logo__pin{flex:0 0 var(--sidebarReducedWidth);display:flex;align-items:center;justify-content:center;
  color:#5f9cfd;font-size:17px;}
.sidebar-is-expanded .logo__pin{color:#fff;}

.c-menu>ul{display:flex;flex-direction:column;width:var(--sidebarExpandedWidth);}
.c-menu>ul .c-menu__item{color:#184a98;max-width:100%;overflow:hidden;}
.c-menu>ul .c-menu__item__inner{display:flex;flex-direction:row;align-items:center;min-height:60px;
  position:relative;cursor:pointer;
  -webkit-transition:background-color .5s ease-in-out;transition:background-color .5s ease-in-out;}
.c-menu>ul .c-menu__item__inner:before{position:absolute;content:" ";height:0;width:2px;left:0;top:50%;
  margin-top:-18px;background-color:var(--light-blue);opacity:0;
  -webkit-transition:all .5s ease-in-out;transition:all .5s ease-in-out;}
.c-menu>ul .c-menu__item.is-active{color:#fff;}
.c-menu>ul .c-menu__item.is-active .c-menu__item__inner{border-left-color:#fff;background-color:#1e3e6f;}
.c-menu>ul .c-menu__item.is-active .c-menu__item__inner i{color:#fff;}
.c-menu>ul .c-menu__item.is-active .c-menu__item__inner .c-menu-item__title span{color:#fff;}
.c-menu>ul .c-menu__item.is-active .c-menu__item__inner:before{height:36px;opacity:1;}
.c-menu>ul .c-menu__item:not(.is-active):hover{color:#fff;}
.c-menu>ul .c-menu__item:not(.is-active):hover .c-menu__item__inner{background-color:var(--orange);border-left-color:var(--orange);}
.c-menu>ul .c-menu__item i{flex:0 0 70px;font-size:16px;font-weight:normal;text-align:center;color:#4d7ec4;
  -webkit-transition:all .5s ease-in-out;transition:all .5s ease-in-out;}
.c-menu>ul .c-menu__item .c-menu-item__title{flex-basis:100%;padding-right:10px;position:relative;color:#fff;
  left:var(--sidebarExpandedWidth);opacity:0;
  -webkit-transition:all .7s ease-in-out;transition:all .7s ease-in-out;}
.c-menu>ul .c-menu__item .c-menu-item__title span{font-weight:400;font-size:14px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;}
.sidebar-is-expanded .c-menu>ul .c-menu__item .c-menu-item__title{left:0;opacity:1;}
.c-menu>ul .c-menu__item .c-menu-item__count{position:relative;left:100px;padding-right:18px;margin-left:auto;
  -webkit-transition:left 1s ease-in-out;transition:left 1s ease-in-out;}
.sidebar-is-expanded .c-menu>ul .c-menu__item .c-menu-item__count{left:0;}

/* ── Zone principale ─────────────────────────────────────────────────────── */
main.l-main{width:100%;height:100%;padding:70px 0 0 var(--sidebarReducedWidth);
  -webkit-transition:padding .5s ease-in-out;transition:padding .5s ease-in-out;}
.sidebar-is-expanded main.l-main{padding-left:var(--sidebarExpandedWidth);}
main.l-main .content-wrapper{padding:25px;height:100%;overflow:auto;}
main.l-main .page-title{font-weight:400;margin-top:0;margin-bottom:25px;}

/* ── Contenu, dans la même grammaire visuelle ────────────────────────────── */
.o-card{background:#fff;border-radius:3px;border:1px solid var(--light-grey);padding:22px;margin-bottom:20px;}
.o-card__title{font-size:15px;font-weight:600;margin:0 0 18px;display:flex;align-items:center;gap:9px;
  padding-bottom:12px;border-bottom:1px solid var(--light-grey);}
.o-card__title small{font-weight:400;color:var(--text-color);font-size:12px;margin-left:auto;}

.o-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;margin-bottom:22px;}
.o-stat{background:#fff;border:1px solid var(--light-grey);border-radius:3px;padding:18px 20px;cursor:pointer;
  border-top:3px solid var(--main-color);
  -webkit-transition:all .3s ease-in-out;transition:all .3s ease-in-out;}
.o-stat:hover{box-shadow:0 5px 14px -1px #cecece;transform:translateY(-2px);}
.o-stat--blue{border-top-color:var(--light-blue);} .o-stat--orange{border-top-color:var(--orange);}
.o-stat--green{border-top-color:var(--green);} .o-stat--gold{border-top-color:var(--gold);}
.o-stat i{font-size:15px;color:var(--text-color);}
.o-stat b{display:block;font-size:30px;font-weight:700;line-height:1.1;margin-top:6px;}
.o-stat span{display:block;font-size:11px;letter-spacing:1px;color:var(--text-color);text-transform:uppercase;
  font-weight:600;margin-top:4px;}

.o-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;}
.o-tabs button{padding:8px 16px;border-radius:20px;border:1px solid var(--light-grey);background:#fff;
  color:var(--text-color);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;
  -webkit-transition:all .3s ease-in-out;transition:all .3s ease-in-out;}
.o-tabs button:hover{border-color:var(--orange);color:var(--orange);}
.o-tabs button.is-on{background:var(--main-color);border-color:var(--main-color);color:#fff;}

.o-row{background:#fff;border:1px solid var(--light-grey);border-left:3px solid var(--light-grey);
  border-radius:3px;padding:16px 18px;margin-bottom:12px;}
.o-row--todo{border-left-color:var(--orange);}
.o-row--doing{border-left-color:var(--gold);}
.o-row--done{border-left-color:var(--green);}
.o-row__head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px;}
.o-row__mail{font-size:14px;font-weight:600;color:var(--main-color);word-break:break-all;}
.o-row__date{font-size:11px;color:var(--text-color);}
.o-chips{display:flex;gap:7px;flex-wrap:wrap;}
.o-chip{font-size:10px;font-weight:600;padding:4px 10px;border-radius:20px;background:#f3f3f3;
  border:1px solid var(--light-grey);color:#6b7a90;white-space:nowrap;text-decoration:none;display:inline-block;}
.o-chip--ok{background:#e8f6ee;border-color:#b7e0c8;color:#1f7a45;}
.o-chip--warn{background:#fff2e8;border-color:#ffd5b8;color:#b4541f;}
.o-chip--info{background:#eaf2ff;border-color:#c4dbff;color:#2c5fb0;}

.o-acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
.o-btn{padding:8px 14px;border-radius:4px;border:1px solid var(--light-grey);background:#fff;
  color:var(--main-color);font-size:11.5px;font-weight:600;cursor:pointer;font-family:inherit;
  -webkit-transition:all .3s ease-in-out;transition:all .3s ease-in-out;}
.o-btn:hover{border-color:var(--orange);color:var(--orange);}
.o-btn.is-on{color:#fff;}
.o-btn--todo.is-on{background:var(--orange);border-color:var(--orange);}
.o-btn--doing.is-on{background:var(--gold);border-color:var(--gold);}
.o-btn--done.is-on{background:var(--green);border-color:var(--green);}
.o-btn--danger{color:var(--red);border-color:#f5c6c2;}
.o-btn--danger:hover{background:var(--red);border-color:var(--red);color:#fff;}
.o-btn--primary{background:var(--main-color);border-color:var(--main-color);color:#fff;}
.o-btn--primary:hover{background:var(--orange);border-color:var(--orange);color:#fff;}

.o-note{width:100%;margin-top:12px;min-height:58px;padding:11px 13px;border-radius:10px;
  border:1px solid var(--light-grey);font-size:12.5px;font-family:inherit;resize:vertical;outline:0;color:var(--main-color);}
.o-note:focus{border-color:var(--light-blue);}

details.o-qa{margin-top:12px;}
details.o-qa summary{cursor:pointer;font-size:11.5px;color:var(--light-blue);font-weight:600;letter-spacing:.5px;}
.o-qa__item{padding:8px 0;border-bottom:1px solid #eef0f3;}
.o-qa__q{font-size:11px;color:var(--text-color);}
.o-qa__r{font-size:12.5px;font-weight:600;margin-top:2px;}

.o-empty{text-align:center;padding:44px 20px;color:var(--text-color);font-size:13px;}

#gate{position:fixed;inset:0;z-index:100;background:var(--main-color);display:flex;align-items:center;
  justify-content:center;padding:24px;}
#gate .box{background:#fff;border-radius:6px;padding:40px 34px;width:min(360px,92vw);text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,.4);}
#gate h1{font-size:19px;margin:0 0 4px;font-weight:600;}
#gate p{font-size:10px;letter-spacing:2px;color:var(--text-color);margin:0 0 24px;text-transform:uppercase;}
#gate input{width:100%;padding:13px;border-radius:10px;border:1px solid var(--light-grey);text-align:center;
  letter-spacing:3px;font-family:monospace;font-size:14px;outline:0;}
#gate button{width:100%;margin-top:14px;padding:13px;border-radius:4px;border:none;background:var(--main-color);
  color:#fff;font-weight:700;letter-spacing:1.5px;font-size:12px;cursor:pointer;font-family:inherit;}
#gate button:hover{background:var(--orange);}
#gate .err{color:var(--red);font-size:11px;min-height:15px;margin-top:10px;}

@media(max-width:700px){
  .page-name{display:none;}
  main.l-main .content-wrapper{padding:14px;}
  .sidebar-is-expanded main.l-main,.sidebar-is-expanded .l-header{padding-left:var(--sidebarReducedWidth);}
  .sidebar-is-expanded .l-sidebar{box-shadow:6px 0 30px rgba(0,0,0,.3);}
}
</style>
</head>

<!-- « sidebar-is-reduced » : à l'arrivée la barre est FERMÉE, il n'en dépasse
     qu'une lisière de 0,5 cm. -->
<body class="sidebar-is-reduced">

<div id="gate">
  <div class="box">
    <h1>Espace de travail</h1>
    <p>Renaissance · Yanis BGH</p>
    <input id="gate-pwd" type="password" placeholder="Code d'accès" autocomplete="off">
    <button id="gate-go">ENTRER</button>
    <div class="err" id="gate-err"></div>
  </div>
</div>

<header class="l-header">
  <div class="l-header__inner">
    <div class="c-header-icon js-hamburger">
      <div class="hamburger-toggle"><span class="bar-top"></span><span class="bar-mid"></span><span class="bar-bot"></span></div>
    </div>
    <div class="page-name" id="titre">Tableau de bord</div>
    <div class="c-search">
      <input class="c-search__input u-input" id="q" placeholder="Rechercher un e-mail, une note…" type="text">
    </div>
    <div class="header-icons-group">
      <div class="c-header-icon" id="refresh" title="Actualiser"><i class="fa-solid fa-rotate-right"></i></div>
      <div class="c-header-icon" id="site" title="Retour au site"><i class="fa-solid fa-power-off"></i></div>
    </div>
  </div>
</header>

<div class="l-sidebar">
  <div class="logo" id="edge" title="Ouvrir / fermer le menu"><div class="logo__pin"><i class="fa-solid fa-bars"></i></div><div class="logo__txt">RENAISSANCE</div></div>
  <div class="l-sidebar__content">
    <nav class="c-menu js-menu"><ul class="u-list" id="menu"></ul></nav>
  </div>
</div>

<main class="l-main">
  <div class="content-wrapper">
    <h1 class="page-title" id="page-title">Tableau de bord</h1>
    <div id="vue"><div class="o-empty">Connexion…</div></div>
  </div>
</main>

<script>
/* ═══════════════════════════════════════════════════════════════════════════
   ⚠️ SÉCURITÉ — la clé service_role est ici en clair, comme dans index.html.
   Elle donne un accès total à la base à qui lit le code source de la page.
   Ce fichier n'aggrave pas la situation (même clé, même site) mais ne la
   corrige pas : voir SECURITE.md.
   ═══════════════════════════════════════════════════════════════════════ */
const SUPA_URL='https://tetknufkdhntmfjssjeg.supabase.co';
const SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRldGtudWZrZGhudG1manNzamVnIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4MzExOTk1MCwiZXhwIjoyMDk4Njk1OTUwfQ.tZl1TvWNj7AXpuVuYNMpJSO_PlkopdMlC9R8dxXYxeM';
/* Trois codes acceptés, sensibles à la casse. */
const CODES=['Treza670','Treza67300','Yanisbgh51100*'];

const $=s=>document.querySelector(s);
const $$=s=>Array.prototype.slice.call(document.querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dt=v=>{ if(!v) return '—'; const d=new Date(v); return isNaN(d)?'—':
  d.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'2-digit'})+' '+
  d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}); };

async function sb(path,opt){
  opt=opt||{};
  const r=await fetch(SUPA_URL+'/rest/v1/'+path,Object.assign({},opt,{
    headers:Object.assign({'Content-Type':'application/json','apikey':SUPA_KEY,
      'Authorization':'Bearer '+SUPA_KEY,'Prefer':opt.prefer||'return=representation'},opt.headers||{})}));
  if(!r.ok) throw new Error(r.status+' '+(await r.text()).slice(0,140));
  const ct=r.headers.get('content-type')||'';
  return ct.includes('json')?r.json():null;
}
const rpc=(fn,p)=>sb('rpc/'+fn,{method:'POST',body:JSON.stringify(p)});

let D={leads:[],histo:[],visiteurs:[],visites:[]};
let vue='dash', filtre='tous', recherche='';

/* L'onglet « À recontacter » a été retiré : c'était la liste des diagnostics,
   simplement filtrée. Le filtre vit maintenant dans la page Diagnostics. */
const PAGES=[
  {id:'dash',    ico:'fa-gauge-high',        lbl:'Tableau de bord',  cnt:function(){ return null; }},
  {id:'diag',    ico:'fa-flask',             lbl:'Diagnostics',      cnt:function(){ return lots().diag.length; }},
  {id:'zyra',    ico:'fa-rocket',            lbl:'Inscrits Zyra',    cnt:function(){ return lots().zyra.length; }},
  {id:'bgh',     ico:'fa-ticket',            lbl:'BGH Party',        cnt:function(){ return lots().bgh.length; }},
  {id:'mails',   ico:'fa-envelope',          lbl:'Tous les e-mails', cnt:function(){ return mails().length; }},
  {id:'visites', ico:'fa-chart-column',         lbl:'Visites du site',  cnt:function(){ return D.visiteurs.length; }},
  {id:'histo',   ico:'fa-clock-rotate-left', lbl:'Historique',       cnt:function(){ return D.histo.length; }},
  {id:'reglages',ico:'fa-cogs',              lbl:'Réglages',         cnt:function(){ return null; }}
];

function lots(){
  const o={diag:[],zyra:[],bgh:[]};
  (D.leads||[]).forEach(function(l){
    const s=(l.source||'diag').toLowerCase();
    if(s==='__site_config') return;
    if(s==='zyra') o.zyra.push(l);
    else if(s==='bgh-party'||s==='bgh') o.bgh.push(l);
    else o.diag.push(l);
  });
  return o;
}
function mails(){
  const par={};
  (D.leads||[]).forEach(function(l){
    const e=(l.email||'').trim().toLowerCase();
    if(!e||(l.source||'')==='__site_config') return;
    const d=l.ts||l.created_at;
    if(!par[e]) par[e]={email:e,src:{},paid:false,last:d,ids:[]};
    par[e].src[l.source||'diag']=1;
    par[e].ids.push(l.id);
    if(l.paid) par[e].paid=true;
    if(d&&(!par[e].last||d>par[e].last)) par[e].last=d;
  });
  return Object.keys(par).map(function(k){ return par[k]; })
    .sort(function(a,b){ return String(b.last||'').localeCompare(String(a.last||'')); });
}
function match(l,q){
  if(!q) return true;
  return [l.email,l.profil,l.suivi_note,l.payer_name,l.event]
    .some(function(v){ return v&&String(v).toLowerCase().indexOf(q.toLowerCase())>=0; });
}

async function charger(){
  $('#vue').innerHTML='<div class="o-empty">Chargement des données…</div>';
  const essais=['diag_leads?order=ts.desc&limit=1500','diag_leads?order=created_at.desc&limit=1500','diag_leads?limit=1500'];
  for(let i=0;i<essais.length;i++){
    try{ const r=await sb(essais[i]); if(Array.isArray(r)){ D.leads=r; break; } }catch(e){ console.warn('[leads]',e.message); }
  }
  try{ D.histo=await sb('rn_history?order=at.desc&limit=400')||[]; }catch(e){ D.histo=[]; }
  try{ D.visiteurs=await sb('visitors?order=created_at.desc&limit=400')||[]; }catch(e){ D.visiteurs=[]; }
  try{ D.visites=await sb('page_visits?order=visit_date.desc&limit=60')||[]; }catch(e){ D.visites=[]; }
  rendreMenu(); rendre();
}

function ligne(l,opts){
  opts=opts||{};
  const st=l.suivi_statut||'a_faire';
  const cls={a_faire:'o-row--todo',en_cours:'o-row--doing',fait:'o-row--done'}[st]||'';
  const m=metaDe(l), qa=qaDe(l), g=m.geo, pay=m.pay||{};
  const ch=[];
  if(l.paid) ch.push('<span class="o-chip o-chip--ok">Payé</span>');
  else if(pay.clicked||l.pay_started_at) ch.push('<span class="o-chip o-chip--warn">A lancé le paiement</span>');
  if(l.potentiel!=null) ch.push('<span class="o-chip o-chip--info">'+esc(l.potentiel)+'% de potentiel</span>');
  if(l.profil&&l.profil.indexOf('(en cours')!==0) ch.push('<span class="o-chip">'+esc(l.profil)+'</span>');
  if(qa.length) ch.push('<span class="o-chip">'+qa.length+'/13 réponses</span>');
  if(!g) ch.push('<span class="o-chip">Géoloc non demandée</span>');
  else if(g.granted&&g.lat!=null) ch.push('<a class="o-chip o-chip--ok" target="_blank" rel="noopener" href="https://www.google.com/maps?q='
    +encodeURIComponent(g.lat+','+g.lng)+'">Géoloc : '+Number(g.lat).toFixed(3)+', '+Number(g.lng).toFixed(3)+'</a>');
  else ch.push('<span class="o-chip o-chip--warn">Géoloc refusée</span>');

  const actions = opts.suivi===false
    ? '<div class="o-acts">'
      +(l.email?'<button class="o-btn js-copy" data-m="'+esc(l.email)+'"><i class="fa-solid fa-copy"></i> Copier l\'e-mail</button>':'')
      +'<button class="o-btn o-btn--danger js-del" data-id="'+esc(l.id)+'" data-m="'+esc(l.email||'')+'"><i class="fa-solid fa-trash"></i> Supprimer</button>'
      +'</div>'
    : '<textarea class="o-note js-note" data-id="'+esc(l.id)+'" placeholder="Note de suivi : ce qui a été dit, ce qu\'il reste à envoyer…">'+esc(l.suivi_note||'')+'</textarea>'
      +'<div class="o-acts">'
      +'<button class="o-btn o-btn--primary js-save" data-id="'+esc(l.id)+'"><i class="fa-solid fa-floppy-disk"></i> Enregistrer la note</button>'
      +'<button class="o-btn o-btn--todo js-st '+(st==='a_faire'?'is-on':'')+'" data-id="'+esc(l.id)+'" data-s="a_faire">À recontacter</button>'
      +'<button class="o-btn o-btn--doing js-st '+(st==='en_cours'?'is-on':'')+'" data-id="'+esc(l.id)+'" data-s="en_cours">En cours</button>'
      +'<button class="o-btn o-btn--done js-st '+(st==='fait'?'is-on':'')+'" data-id="'+esc(l.id)+'" data-s="fait">Fait</button>'
      +(l.email?'<button class="o-btn js-copy" data-m="'+esc(l.email)+'"><i class="fa-solid fa-copy"></i> Copier</button>':'')
      +'<button class="o-btn o-btn--danger js-del" data-id="'+esc(l.id)+'" data-m="'+esc(l.email||'')+'"><i class="fa-solid fa-trash"></i></button>'
      +'</div>';

  return '<div class="o-row '+cls+'">'
    +'<div class="o-row__head">'
      +'<span class="o-row__mail"><i class="fa-solid fa-envelope" style="color:#5f9cfd;margin-right:7px;"></i>'+esc(l.email||'(sans e-mail)')+'</span>'

    +'<div class="o-chips">'+ch.join('')+'</div>'
    +(qa.length?'<details class="o-qa"><summary>Voir les '+qa.length+' réponses</summary>'

      +'</details>':'')
    +actions+'</div>';
}

/* Courbe en SVG : aucune bibliothèque à charger, net à toute largeur. */
function courbe(nb){
  const V=D.visites||[], pts=[];
  for(let i=nb-1;i>=0;i--){
    const d=new Date(); d.setDate(d.getDate()-i);
    const iso=d.toISOString().slice(0,10);
    const r=V.find(function(x){ return x.visit_date===iso; });
    pts.push({val:r?(r.count||0):0,lbl:d.toLocaleDateString('fr-FR',{weekday:'short',day:'numeric'})});
  }
  if(!pts.some(function(p){ return p.val; })) return '<div class="o-empty">Aucune visite enregistrée sur la période.</div>';
  const W=680,H=200,mx=34,my=24;
  const max=Math.max.apply(null,pts.map(function(p){ return p.val; }).concat([1]));
  const X=i=>mx+i*((W-mx*2)/Math.max(pts.length-1,1)), Y=v=>H-my-(v/max)*(H-my*2);
  const l=pts.map(function(p,i){ return (i?'L':'M')+X(i).toFixed(1)+','+Y(p.val).toFixed(1); }).join(' ');
  return '<div style="overflow-x:auto;"><svg viewBox="0 0 '+W+' '+(H+24)+'" style="width:100%;min-width:420px;display:block;">'
    +'<defs><linearGradient id="g1" x1="0" y1="0" x2="0" y2="1">'
    +'<stop offset="0%" stop-color="#5f9cfd" stop-opacity=".28"/><stop offset="100%" stop-color="#5f9cfd" stop-opacity="0"/></linearGradient></defs>'
    +[0,.25,.5,.75,1].map(function(f){ const y=Y(max*f);
      return '<line x1="'+mx+'" y1="'+y+'" x2="'+(W-mx)+'" y2="'+y+'" stroke="#e6e8ec"/>'
        +'<text x="'+(mx-7)+'" y="'+(y+4)+'" text-anchor="end" font-size="9" fill="#ababab">'+Math.round(max*f)+'</text>'; }).join('')
    +'<path d="'+l+' L'+X(pts.length-1).toFixed(1)+','+(H-my)+' L'+X(0).toFixed(1)+','+(H-my)+' Z" fill="url(#g1)"/>'
    +'<path d="'+l+'" fill="none" stroke="#5f9cfd" stroke-width="2" stroke-linejoin="round"/>'
    +pts.map(function(p,i){ return '<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(p.val).toFixed(1)+'" r="3.5" fill="#5f9cfd"/>'
      +'<text x="'+X(i).toFixed(1)+'" y="'+(Y(p.val)-9).toFixed(1)+'" text-anchor="middle" font-size="10" font-weight="700" fill="#102c58">'+p.val+'</text>'
      +'<text x="'+X(i).toFixed(1)+'" y="'+(H+15)+'" text-anchor="middle" font-size="9" fill="#ababab">'+esc(p.lbl)+'</text>'; }).join('')
    +'</svg></div>';
}

async function purger(){
  const vis=D.visiteurs||[]; if(vis.length<=400) return 0;
  const vieux=vis.slice().sort(function(a,b){ return String(a.created_at||'').localeCompare(String(b.created_at||'')); }).slice(0,200);
  let n=0;
  for(let i=0;i<vieux.length;i++){
    try{ await sb('visitors?id=eq.'+encodeURIComponent(vieux[i].id),{method:'DELETE'}); n++; }catch(e){}
  }
  return n;
}

function copier(txt,btn){
  const ok=function(){ const a=btn.innerHTML; btn.innerHTML='<i class="fa-solid fa-check"></i> Copié';
    setTimeout(function(){ btn.innerHTML=a; },1400); };
  if(navigator.clipboard&&navigator.clipboard.writeText)
    navigator.clipboard.writeText(txt).then(ok,function(){ prompt('Copie manuelle :',txt); });
  else prompt('Copie manuelle :',txt);
}

const AIDE_SQL="Échec.\n\nSi le message parle d'une fonction ou d'une colonne manquante, c'est que supabase-SUIVI.sql n'a pas encore été exécuté dans Supabase.\n\n";

function brancher(){
  const v=$('#vue');
  v.querySelectorAll('.o-tabs button').forEach(function(b){ b.onclick=function(){ filtre=b.dataset.f; rendre(); }; });
  v.querySelectorAll('[data-go]').forEach(function(b){
    if(b.dataset.go) b.onclick=function(){ vue=b.dataset.go; rendreMenu(); rendre(); };
  });
  v.querySelectorAll('.js-copy').forEach(function(b){ b.onclick=function(){ copier(b.dataset.m,b); }; });
  const ca=v.querySelector('#cpall');
  if(ca) ca.onclick=function(){ copier(mails().map(function(m){ return m.email; }).join(', '),ca); };

  v.querySelectorAll('.js-st').forEach(function(b){ b.onclick=async function(){
    b.disabled=true;
    try{
      await rpc('rn_set_suivi',{p_lead_id:b.dataset.id,p_statut:b.dataset.s,p_note:null});
      const l=D.leads.find(function(x){ return x.id===b.dataset.id; });
      if(l) l.suivi_statut=b.dataset.s;
      rendreMenu(); rendre();
    }catch(e){ alert(AIDE_SQL+e.message); b.disabled=false; }
  }; });

  v.querySelectorAll('.js-save').forEach(function(b){ b.onclick=async function(){
    const ta=v.querySelector('.js-note[data-id="'+b.dataset.id+'"]'); if(!ta) return;
    const a=b.innerHTML; b.innerHTML='…'; b.disabled=true;
    try{
      await rpc('rn_set_suivi',{p_lead_id:b.dataset.id,p_statut:null,p_note:ta.value});
      const l=D.leads.find(function(x){ return x.id===b.dataset.id; });
      if(l) l.suivi_note=ta.value;
      b.innerHTML='<i class="fa-solid fa-check"></i> Enregistré';
      setTimeout(function(){ b.innerHTML=a; b.disabled=false; },1400);
    }catch(e){ alert(AIDE_SQL+e.message); b.innerHTML=a; b.disabled=false; }
  }; });

  v.querySelectorAll('.js-del').forEach(function(b){ b.onclick=async function(){
    if(!confirm('Supprimer définitivement la fiche de '+(b.dataset.m||'ce contact')+' ?\n\nCette action est irréversible.')) return;
    try{
      await sb('diag_leads?id=eq.'+encodeURIComponent(b.dataset.id),{method:'DELETE'});
      D.leads=D.leads.filter(function(x){ return x.id!==b.dataset.id; });
      rendreMenu(); rendre();
    }catch(e){ alert('Suppression impossible : '+e.message); }
  }; });

  /* Supprime TOUTES les fiches portant cette adresse — diagnostics comme
     inscriptions Zyra ou BGH — pour que l'adresse disparaisse réellement. */
  v.querySelectorAll('.js-delmail').forEach(function(b){ b.onclick=async function(){
    const ids=(b.dataset.ids||'').split(',').filter(Boolean);
    if(!confirm('Supprimer '+b.dataset.m+' ?\n\n'+ids.length+' fiche(s) liée(s) à cette adresse seront supprimées définitivement.')) return;
    try{
      for(let i=0;i<ids.length;i++) await sb('diag_leads?id=eq.'+encodeURIComponent(ids[i]),{method:'DELETE'});
      D.leads=D.leads.filter(function(x){ return ids.indexOf(x.id)<0; });
      rendreMenu(); rendre();
    }catch(e){ alert('Suppression impossible : '+e.message); }
  }; });

  const pt=v.querySelector('#purge-tgl');
  if(pt){
    const peindre=function(){
      const on=purgeOn();
      pt.innerHTML=on?'<i class="fa-solid fa-toggle-on"></i> Activée — cliquer pour désactiver'
                     :'<i class="fa-solid fa-toggle-off"></i> Désactivée — cliquer pour activer';
      pt.className='o-btn'+(on?' o-btn--danger':'');
    };
    peindre();
    pt.onclick=async function(){
      const on=purgeOn();
      if(!on&&!confirm("Activer l'auto-purge ?\n\nLes 200 visiteurs les plus anciens seront supprimés maintenant.\nLe compteur de visites totales n'est pas touché.")) return;
      try{ localStorage.setItem(PURGE_KEY,on?'0':'1'); }catch(e){}
      if(!on){ pt.innerHTML='Purge en cours…'; const n=await purger(); await charger(); alert(n+' visiteur(s) supprimé(s).'); return; }
      peindre();
    };
  }
}

/* Repli si FontAwesome ne charge pas (réseau, bloqueur) : sans lui la barre
   n'afficherait que des carrés vides. On bascule alors sur des pictogrammes
   Unicode, moins fins mais toujours lisibles. */
(function(){
  const SECOURS={'fa-gauge-high':'▦','fa-flask':'⚗','fa-rocket':'🚀','fa-ticket':'🎟',
    'fa-envelope':'✉','fa-chart-column':'📊','fa-clock-rotate-left':'🕘','fa-cogs':'⚙',
    'fa-bars':'☰','fa-rotate-right':'↻','fa-power-off':'⏻','fa-chart-line':'📈',
    'fa-calendar-day':'📅','fa-calendar':'🗓','fa-clipboard-list':'📋','fa-circle-check':'✔',
    'fa-thumbtack':'📌','fa-euro-sign':'€','fa-eye':'👁','fa-chart-area':'📈','fa-copy':'⧉',
    'fa-trash':'🗑','fa-trash-can':'🗑','fa-floppy-disk':'💾','fa-check':'✔','fa-users':'👥',
    'fa-circle-info':'ℹ','fa-toggle-on':'◉','fa-toggle-off':'◯'};
  function verifier(){
    const t=document.createElement('i');
    t.className='fa-solid fa-envelope'; t.style.cssText='position:absolute;left:-9999px;';
    document.body.appendChild(t);
    const ok=getComputedStyle(t,':before').fontFamily.toLowerCase().indexOf('awesome')>=0;
    t.remove();
    if(ok) return;
    document.querySelectorAll('i[class*="fa-"]').forEach(function(i){
      const cl=Array.prototype.slice.call(i.classList).find(function(c){ return SECOURS[c]; });
      if(cl){ i.textContent=SECOURS[cl]; i.className='ico-secours'; i.style.fontStyle='normal'; }
    });
  }
  // Laisse au CDN le temps de répondre, puis re-vérifie après chaque rendu.
  setTimeout(verifier,1500);
  window.__verifIcones=verifier;
})();

/* ── Barre latérale : poignée du haut et hamburger ──────────────────────── */
function basculer(){
  document.body.classList.toggle('sidebar-is-reduced');
  document.body.classList.toggle('sidebar-is-expanded');
  const h=document.querySelector('.hamburger-toggle');
  if(h) h.classList.toggle('is-opened');
}
document.querySelector('.js-hamburger').onclick=basculer;
$('#edge').onclick=basculer;
$('#refresh').onclick=charger;
$('#site').onclick=function(){ location.href='index.html'; };
$('#q').oninput=function(e){ recherche=e.target.value; rendre(); };

function entrer(){
  if(CODES.indexOf($('#gate-pwd').value.trim())<0){
    $('#gate-err').textContent='Code incorrect.';
    setTimeout(function(){ const e=$('#gate-err'); if(e) e.textContent=''; },1800);
    return;
  }
  $('#gate').remove();
  charger();   // la barre reste FERMÉE : rien ne s'ouvre à l'arrivée
}
$('#gate-go').onclick=entrer;
$('#gate-pwd').onkeydown=function(e){ if(e.key==='Enter') entrer(); };
setTimeout(function(){ $('#gate-pwd').focus(); },100);
</script>
