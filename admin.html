<!DOCTYPE html>
<!-- Renaissance — Espace de travail Yanis BGH.
     Structure d'après « Dashboard / Admin Panel » de Jacek Dunikowski (MIT),
     https://codepen.io/jaca90/pen/vZJZMx — barre réductible, en-tête, contenu.
     Icônes dessinées en SVG dans la page : aucune dépendance externe, donc
     aucun risque de carré vide si un CDN ne répond pas. -->
<html lang="fr" data-theme="jour">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
/* ── Échelle de texte : même rendu sur tous les téléphones ───────────────
   Les tailles du site étaient écrites en pixels fixes. Sur un écran plus
   étroit que celui qui a servi à régler la maquette (412 px), un texte de
   12 px occupe proportionnellement plus de place : tout paraît zoomé et les
   titres débordent.
   --u est l'unité de base : elle vaut 16 px à partir de 412 px de large, et
   rétrécit proportionnellement en dessous. Chaque taille du site s'exprime
   en multiple de --u, donc tout suit la même règle.
   Plafonnée à 16 px : au-delà de la référence — grands téléphones, tablettes,
   ordinateurs — le rendu reste exactement celui d'avant.
   Du CSS seul, aucune manipulation du viewport : les navigateurs intégrés
   d'Instagram et de TikTok appliquent ceci comme les autres. ─────────── */
:root{ --u: clamp(12px, 3.8835vw, 16px); }
</style>
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Cache-Control" content="no-store">
<title>Renaissance — Espace de travail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --rail:56px;                 /* barre fermée : les icônes restent visibles */
  --open:232px;
  --head:52px;                 /* en-tête fin */
  --navy:#051835;
  --main:#102c58;
  --blue:#5f9cfd;
  --orange:#f5642d;
  --green:#1f9d55;
  --gold:#a07f43;
  --red:#e0402f;
  --site:#3a52d6;              /* le bleu du site public, à l'identique */
  --site-2:#5a78ff;
}
/* ── Thème jour ─────────────────────────────────────────────────────────── */
html[data-theme="jour"]{
  --bg:#f1f3f7; --surface:#ffffff; --surface2:#f7f9fc;
  --line:#e2e6ee; --ink:#102c58; --ink2:#5a6b85; --ink3:#96a2b6;
  --shadow:0 1px 2px rgba(16,44,88,.05), 0 8px 24px -12px rgba(16,44,88,.18);
  --shadow-h:0 2px 6px rgba(16,44,88,.07), 0 16px 32px -14px rgba(16,44,88,.26);
}
/* ── Thème nuit ─────────────────────────────────────────────────────────── */
html[data-theme="nuit"]{
  --bg:#0a0e17; --surface:#111826; --surface2:#0d1420;
  --line:#1e293b; --ink:#e6edf8; --ink2:#94a3b8; --ink3:#64748b;
  --navy:#060b14; --main:#0d1626;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.7);
  --shadow-h:0 2px 6px rgba(0,0,0,.5), 0 16px 32px -14px rgba(0,0,0,.8);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;width:100%;margin:0;}
body{font-family:"Open Sans",system-ui,sans-serif;font-size:calc(var(--u)*0.875000);overflow:hidden;
  background:var(--bg);color:var(--ink);
  transition:background .4s ease,color .4s ease;}
button,input,textarea{font-family:inherit;}
a{text-decoration:none;color:inherit;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px;}
::-webkit-scrollbar-track{background:transparent;}

/* ── En-tête ────────────────────────────────────────────────────────────── */
.l-header{position:fixed;top:0;left:var(--rail);right:0;height:var(--head);z-index:30;
  background:var(--surface);border-bottom:1px solid var(--line);
  display:flex;align-items:center;
  transition:left .42s cubic-bezier(.4,0,.2,1),background .4s ease,border-color .4s ease;}
body.is-open .l-header{left:var(--open);}
.h-btn{width:var(--head);height:var(--head);display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:var(--ink2);border-right:1px solid var(--line);flex-shrink:0;
  transition:color .2s,background .2s;}
.h-btn:last-child{border-right:0;}
.h-btn:hover{color:var(--orange);background:var(--surface2);}
.h-btn svg{width:17px;height:17px;}
.h-title{padding:0 16px;font-size:calc(var(--u)*0.843750);font-weight:700;white-space:nowrap;letter-spacing:.2px;}
.h-search{flex:1;min-width:0;height:100%;display:flex;align-items:center;
  border-left:1px solid var(--line);border-right:1px solid var(--line);}
.h-search input{width:100%;height:100%;border:0;background:transparent;color:var(--ink);
  font-size:calc(var(--u)*0.812500);padding:0 16px;outline:0;}
.h-search input::placeholder{color:var(--ink3);}
.h-right{margin-left:auto;display:flex;height:100%;flex-shrink:0;border-left:1px solid var(--line);}

/* ── Barre latérale ─────────────────────────────────────────────────────── */
.l-side{position:fixed;left:0;top:0;bottom:0;width:var(--rail);z-index:40;background:var(--main);
  overflow:hidden;transition:width .42s cubic-bezier(.4,0,.2,1),background .4s ease;}
body.is-open .l-side{width:var(--open);}

.s-grip{height:var(--head);display:flex;align-items:center;background:var(--navy);cursor:pointer;
  transition:background .25s;}
.s-grip:hover{background:#0a2450;}
.s-grip__ico{flex:0 0 var(--rail);display:flex;align-items:center;justify-content:center;color:var(--blue);}
.s-grip__ico svg{width:19px;height:19px;transition:transform .42s cubic-bezier(.4,0,.2,1);}
body.is-open .s-grip__ico svg{transform:rotate(90deg);color:#fff;}
.s-grip__txt{font-size:calc(var(--u)*0.812500);font-weight:800;letter-spacing:3px;color:#fff;white-space:nowrap;
  opacity:0;transition:opacity .3s ease .1s;}
body.is-open .s-grip__txt{opacity:1;}

.s-menu{list-style:none;margin:0;padding:6px 0;width:var(--open);}
.s-item{display:flex;align-items:center;min-height:52px;cursor:pointer;position:relative;
  color:#8fa8cc;transition:background .28s ease,color .28s ease;}
.s-item:before{content:"";position:absolute;left:0;top:50%;margin-top:-14px;width:3px;height:0;
  background:var(--blue);opacity:0;transition:all .3s ease;}
.s-item:hover{background:var(--orange);color:#fff;}
.s-item.on{background:rgba(95,156,253,.14);color:#fff;}
.s-item.on:before{height:28px;opacity:1;}
/* L'icône occupe exactement la largeur du rail → parfaitement centrée,
   fermée comme ouverte. */
.s-item__ico{flex:0 0 var(--rail);display:flex;align-items:center;justify-content:center;}
.s-item__ico svg{width:19px;height:19px;}
.s-item__txt{flex:1;font-size:calc(var(--u)*0.843750);white-space:nowrap;opacity:0;transform:translateX(-8px);
  transition:opacity .3s ease,transform .3s ease;}
body.is-open .s-item__txt{opacity:1;transform:none;}
.s-item__n{margin-right:16px;font-size:calc(var(--u)*0.625000);font-weight:800;background:var(--blue);color:#04122b;
  padding:3px 8px;border-radius:20px;min-width:22px;text-align:center;opacity:0;transition:opacity .3s ease;}
body.is-open .s-item__n{opacity:1;}

/* ── Contenu ────────────────────────────────────────────────────────────── */
.l-main{position:absolute;top:var(--head);left:var(--rail);right:0;bottom:0;overflow-y:auto;padding:22px;
  transition:left .42s cubic-bezier(.4,0,.2,1);}
body.is-open .l-main{left:var(--open);}
.p-title{font-size:calc(var(--u)*1.375000);font-weight:300;margin:0 0 20px;letter-spacing:.3px;}

/* Entrée des pages et des blocs : discrète, jamais tape-à-l'œil. */
@keyframes monte{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
@keyframes fondu{from{opacity:0;}to{opacity:1;}}
.anim{animation:monte .42s cubic-bezier(.16,1,.3,1) both;}
#vue.swap{animation:fondu .3s ease both;}
@media (prefers-reduced-motion:reduce){.anim,#vue.swap{animation:none;}}

/* ── Accueil du tableau de bord ─────────────────────────────────────────── */
.hello{margin:0 0 16px;}
.hello b{display:block;font-size:calc(var(--u)*1.1875);font-weight:800;letter-spacing:-.4px;}
.hello span{display:block;margin-top:3px;font-size:calc(var(--u)*0.8125);color:var(--ink2);}

/* Les compteurs tiennent sur UNE seule ligne à toutes les résolutions : sur
   écran étroit la rangée défile latéralement au lieu de se replier, ce qui
   garde la même lecture d'un téléphone à un écran d'ordinateur. */
.rings{display:flex;flex-wrap:nowrap;gap:12px;overflow-x:auto;overscroll-behavior-x:contain;
  padding:2px 2px 12px;scroll-snap-type:x proximity;scroll-behavior:smooth;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;}
.rings::-webkit-scrollbar{height:0;width:0;}

/* Rien n'indiquait que la rangée défilait : les flèches le disent. Elles
   n'apparaissent que si la rangée dépasse réellement de l'écran, et
   s'éteignent une fois arrivé au bout. */
.ringsbar{display:flex;align-items:flex-start;gap:6px;margin-bottom:18px;}
.ringnav{flex:0 0 auto;margin-top:18px;width:28px;height:28px;border-radius:50%;
  border:1px solid var(--line);background:var(--surface);color:var(--site);
  display:none;align-items:center;justify-content:center;cursor:pointer;padding:0;
  box-shadow:var(--shadow);transition:opacity .2s ease,border-color .2s ease,transform .2s ease;}
.ringnav.on{display:flex;}
.ringnav svg{width:15px;height:15px;}
.ringnav:hover:not(:disabled){border-color:var(--site);transform:scale(1.08);}
.ringnav:disabled{opacity:.28;cursor:default;}
/* Colonne explicite : sans elle, un bouton centre son contenu verticalement
   et le cercle d'« À recontacter », dont l'intitulé tient sur deux lignes,
   remontait au-dessus des autres. */
.ring{flex:0 0 auto;width:74px;background:none;border:0;padding:0;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  text-align:center;scroll-snap-align:start;font:inherit;color:inherit;}
.ring__o{width:62px;height:62px;margin:0 auto 7px;border-radius:50%;
  border:1mm solid var(--site);background:var(--surface);
  display:flex;align-items:center;justify-content:center;
  transition:transform .2s cubic-bezier(.16,1,.3,1),box-shadow .2s ease,border-color .2s ease;}
.ring__n{font-weight:800;line-height:1;letter-spacing:-.5px;font-size:calc(var(--u)*0.9375);}
.ring__n.lg{font-size:calc(var(--u)*0.7500);}    /* 4 chiffres et plus */
.ring__l{font-size:calc(var(--u)*0.5000);letter-spacing:.5px;text-transform:uppercase;
  font-weight:700;color:var(--ink3);line-height:1.3;min-height:2.6em;}
.ring:hover .ring__o{transform:translateY(-2px);border-color:var(--site-2);
  box-shadow:0 0 0 4px rgba(58,82,214,.16);}
.ring:focus-visible .ring__o{outline:2px solid var(--site-2);outline-offset:3px;}
/* Les blocs d'information du tableau de bord, resserrés. */
.box--sm{padding:15px 16px;margin-bottom:14px;}
.box--sm .box__t{font-size:calc(var(--u)*0.7500);margin-bottom:12px;padding-bottom:9px;}
.box--sm .box__t svg{width:13px;height:13px;}
.box--sm .box__t small{font-size:calc(var(--u)*0.6250);}
.box--sm .qa__r{font-size:calc(var(--u)*0.7188);}
.box--sm .qa__q{font-size:calc(var(--u)*0.6250);}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:14px;margin-bottom:22px;}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;
  cursor:pointer;position:relative;overflow:hidden;box-shadow:var(--shadow);
  transition:transform .25s cubic-bezier(.16,1,.3,1),box-shadow .25s ease,border-color .25s ease;}
.card:before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--main);
  transform:scaleX(0);transform-origin:left;transition:transform .35s cubic-bezier(.16,1,.3,1);}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-h);}
.card:hover:before{transform:scaleX(1);}
.card--blue:before{background:var(--blue);} .card--orange:before{background:var(--orange);}
.card--green:before{background:var(--green);} .card--gold:before{background:var(--gold);}
.card__ico{color:var(--ink3);margin-bottom:10px;}
.card__ico svg{width:17px;height:17px;}
.card__n{font-size:calc(var(--u)*1.875000);font-weight:800;line-height:1;letter-spacing:-.5px;}
.card__l{font-size:calc(var(--u)*0.625000);letter-spacing:1.2px;color:var(--ink3);text-transform:uppercase;
  font-weight:700;margin-top:6px;}

.box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;
  margin-bottom:18px;box-shadow:var(--shadow);}
.box__t{font-size:calc(var(--u)*0.843750);font-weight:700;margin:0 0 16px;display:flex;align-items:center;gap:9px;
  padding-bottom:12px;border-bottom:1px solid var(--line);}
.box__t svg{width:15px;height:15px;color:var(--ink3);}
.box__t small{font-weight:600;color:var(--ink3);font-size:calc(var(--u)*0.687500);margin-left:auto;}

.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px;}
.tabs button{padding:8px 15px;border-radius:20px;border:1px solid var(--line);background:var(--surface);
  color:var(--ink2);font-size:calc(var(--u)*0.750000);font-weight:600;cursor:pointer;transition:all .25s ease;}
.tabs button:hover{border-color:var(--orange);color:var(--orange);}
.tabs button.on{background:var(--main);border-color:var(--main);color:#fff;}
html[data-theme="nuit"] .tabs button.on{background:var(--blue);border-color:var(--blue);color:#04122b;}

.row{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--line);
  border-radius:12px;padding:15px 17px;margin-bottom:11px;cursor:pointer;box-shadow:var(--shadow);
  transition:transform .22s cubic-bezier(.16,1,.3,1),box-shadow .22s ease;}
.row:hover{transform:translateY(-2px);box-shadow:var(--shadow-h);}
.row--todo{border-left-color:var(--orange);}
.row--doing{border-left-color:var(--gold);}
.row--done{border-left-color:var(--green);}
.row__h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:9px;}
.row__m{font-size:calc(var(--u)*0.843750);font-weight:700;word-break:break-all;display:flex;align-items:center;gap:7px;}
.row__m svg{width:14px;height:14px;color:var(--blue);flex-shrink:0;}
.row__d{font-size:calc(var(--u)*0.687500);color:var(--ink3);display:flex;align-items:center;gap:8px;}
.row__go{display:inline-flex;align-items:center;gap:4px;font-size:calc(var(--u)*0.625000);font-weight:700;
  color:var(--blue);opacity:0;transform:translateX(-4px);transition:opacity .25s,transform .25s;white-space:nowrap;}
.row:hover .row__go{opacity:1;transform:none;}
.row__go svg{width:12px;height:12px;}
@media(hover:none){.row__go{opacity:.75;transform:none;}}
.chips{display:flex;gap:6px;flex-wrap:wrap;}
.chip{font-size:calc(var(--u)*0.625000);font-weight:600;padding:4px 10px;border-radius:20px;background:var(--surface2);
  border:1px solid var(--line);color:var(--ink2);white-space:nowrap;display:inline-block;}
.chip--ok{background:rgba(31,157,85,.12);border-color:rgba(31,157,85,.3);color:var(--green);}
.chip--warn{background:rgba(245,100,45,.12);border-color:rgba(245,100,45,.3);color:var(--orange);}
.chip--info{background:rgba(95,156,253,.12);border-color:rgba(95,156,253,.3);color:var(--blue);}

.acts{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px;}
.btn{padding:8px 13px;border-radius:8px;border:1px solid var(--line);background:var(--surface);
  color:var(--ink);font-size:calc(var(--u)*0.718750);font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;
  transition:all .22s ease;}
.btn svg{width:13px;height:13px;}
.btn:hover{border-color:var(--orange);color:var(--orange);transform:translateY(-1px);}
.btn.on{color:#fff;}
.btn--todo.on{background:var(--orange);border-color:var(--orange);}
.btn--doing.on{background:var(--gold);border-color:var(--gold);}
.btn--done.on{background:var(--green);border-color:var(--green);}
.btn--danger{color:var(--red);border-color:rgba(224,64,47,.3);}
.btn--danger:hover{background:var(--red);border-color:var(--red);color:#fff;}
.btn--primary{background:var(--main);border-color:var(--main);color:#fff;}
html[data-theme="nuit"] .btn--primary{background:var(--blue);border-color:var(--blue);color:#04122b;}
.btn--primary:hover{background:var(--orange);border-color:var(--orange);color:#fff;}

.note{width:100%;margin-top:11px;min-height:56px;padding:11px 13px;border-radius:10px;
  border:1px solid var(--line);background:var(--surface2);color:var(--ink);
  font-size:calc(var(--u)*0.781250);resize:vertical;outline:0;transition:border-color .2s;}
.note:focus{border-color:var(--blue);}

.qa{padding:8px 0;border-bottom:1px solid var(--line);}
.qa__q{font-size:calc(var(--u)*0.687500);color:var(--ink3);}
.qa__r{font-size:calc(var(--u)*0.781250);font-weight:600;margin-top:2px;}
.vide{text-align:center;padding:42px 20px;color:var(--ink3);font-size:calc(var(--u)*0.812500);}

/* ── Fenêtre de détail ──────────────────────────────────────────────────── */
@keyframes ouvre{from{opacity:0;transform:translateY(18px) scale(.985);}to{opacity:1;transform:none;}}
.modal{position:fixed;inset:0;z-index:80;background:rgba(5,12,26,.62);backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;padding:18px;animation:fondu .22s ease both;}
.modal__box{background:var(--surface);border:1px solid var(--line);border-radius:16px;
  width:min(760px,100%);max-height:92vh;overflow-y:auto;box-shadow:0 40px 90px rgba(0,0,0,.5);
  animation:ouvre .34s cubic-bezier(.16,1,.3,1) both;}
.modal__h{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--line);
  padding:18px 22px;display:flex;align-items:center;gap:12px;z-index:2;}
.modal__h h2{font-size:calc(var(--u)*1.000000);margin:0;font-weight:700;word-break:break-all;flex:1;}
.modal__x{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--surface2);
  color:var(--ink2);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.modal__x:hover{background:var(--red);border-color:var(--red);color:#fff;}
.modal__b{padding:20px 22px 26px;}
.dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:18px;}
.dl div{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:11px 13px;}
.dl dt{font-size:calc(var(--u)*0.625000);letter-spacing:1px;text-transform:uppercase;color:var(--ink3);font-weight:700;}
.dl dd{margin:4px 0 0;font-size:calc(var(--u)*0.812500);font-weight:600;word-break:break-word;}
.sect{font-size:calc(var(--u)*0.750000);font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--ink3);
  margin:20px 0 10px;padding-top:14px;border-top:1px solid var(--line);}

/* ── Porte d'entrée ─────────────────────────────────────────────────────── */
#gate{position:fixed;inset:0;z-index:100;background:var(--main);display:flex;align-items:center;
  justify-content:center;padding:24px;}
#gate .b{background:var(--surface);border-radius:16px;padding:38px 32px;width:min(360px,92vw);
  text-align:center;box-shadow:0 30px 70px rgba(0,0,0,.45);animation:ouvre .4s cubic-bezier(.16,1,.3,1) both;}
#gate h1{font-size:calc(var(--u)*1.125000);margin:0 0 4px;font-weight:700;}
#gate p{font-size:calc(var(--u)*0.625000);letter-spacing:2px;color:var(--ink3);margin:0 0 22px;text-transform:uppercase;}
#gate input{width:100%;padding:13px;border-radius:10px;border:1px solid var(--line);text-align:center;
  letter-spacing:3px;font-family:monospace;font-size:calc(var(--u)*0.875000);outline:0;background:var(--surface2);color:var(--ink);}
#gate button{width:100%;margin-top:13px;padding:13px;border-radius:10px;border:none;background:var(--main);
  color:#fff;font-weight:700;letter-spacing:1.5px;font-size:calc(var(--u)*0.750000);cursor:pointer;transition:background .25s;}
#gate button:hover{background:var(--orange);}
#gate .e{color:var(--red);font-size:calc(var(--u)*0.687500);min-height:15px;margin-top:9px;}

@media(max-width:700px){
  .h-title{display:none;}
  .l-main{padding:14px;}
  body.is-open .l-header,body.is-open .l-main{left:var(--rail);}
  body.is-open .l-side{box-shadow:6px 0 34px rgba(0,0,0,.35);}
  .modal{padding:0;align-items:flex-end;}
  .modal__box{max-height:94vh;border-radius:18px 18px 0 0;}
}
</style>
</head>
<body>

<div id="gate">
  <div class="b">
    <h1>Espace de travail</h1>
    <p>Renaissance · Yanis BGH</p>
    <input id="gp" type="password" placeholder="Code d'accès" autocomplete="off">
    <button id="gg">ENTRER</button>
    <div class="e" id="ge"></div>

async function api(path,opt){
  opt=opt||{};
  const r=await fetch(SUPA_URL+'/rest/v1/'+path,Object.assign({},opt,{
    headers:Object.assign({'Content-Type':'application/json','apikey':SUPA_KEY,
      'Authorization':'Bearer '+SUPA_KEY,'Prefer':'return=representation'},opt.headers||{})}));
  if(!r.ok) throw new Error(r.status+' '+(await r.text()).slice(0,140));
  const ct=r.headers.get('content-type')||'';
  return ct.includes('json')?r.json():null;
}

   elle que la page publique lit pour afficher le montant et rediriger. */
async function lireConfig(){
  try{
    const r=await api('diag_leads?source=eq.__site_config&select=potentiel,axe_prioritaire&order=ts.desc&limit=1');
    if(Array.isArray(r)&&r.length){
      if(r[0].potentiel!=null) CFG.price=parseInt(r[0].potentiel,10);
      if(r[0].axe_prioritaire) CFG.link=String(r[0].axe_prioritaire);
    }
  }catch(e){ console.warn('[config]',e.message); }
  return CFG;
}
async function ecrireConfig(prix,lien){
  const v=parseInt(prix,10);
  if(!(v>0)) throw new Error('Le prix doit être un nombre supérieur à zéro.');
  const body={potentiel:v};
  if(lien&&String(lien).trim()) body.axe_prioritaire=String(lien).trim();
  const ex=await api('diag_leads?source=eq.__site_config&select=id&limit=1');
  if(Array.isArray(ex)&&ex.length){
    await api('diag_leads?source=eq.__site_config',{method:'PATCH',body:JSON.stringify(body)});
  } else {
    body.source='__site_config'; body.profil='__price'; body.email=''; body.tel='';
    body.code_postal=''; body.paid=false; body.exploite=0; body.scores={};
    body.ts=new Date().toISOString();
    await api('diag_leads',{method:'POST',body:JSON.stringify(body)});
  }
  CFG.price=v; if(body.axe_prioritaire) CFG.link=body.axe_prioritaire;
}

    if(s==='zyra') o.zyra.push(l);

function mails(){

    const e=(l.email||'').trim().toLowerCase();
    if(!e||(l.source||'')==='__site_config') return;
    const d=l.ts||l.created_at;
    if(!par[e]) par[e]={email:e,src:{},paid:false,last:d,ids:[]};
    par[e].src[l.source||'diag']=1; par[e].ids.push(l.id);
    if(l.paid) par[e].paid=true;
    if(d&&(!par[e].last||d>par[e].last)) par[e].last=d;
  });
  return Object.keys(par).map(k=>par[k]).sort((a,b)=>String(b.last||'').localeCompare(String(a.last||'')));

function puces(l){
  const m=metaDe(l), qa=qaDe(l), g=m.geo, pay=m.pay||{}, c=[];
  if(l.paid) c.push('<span class="chip chip--ok">Payé</span>');
  else if(pay.clicked||l.pay_started_at) c.push('<span class="chip chip--warn">A lancé le paiement</span>');

  if(l.profil&&l.profil.indexOf('(en cours')!==0) c.push('<span class="chip">'+esc(l.profil)+'</span>');
  if(qa.length) c.push('<span class="chip">'+qa.length+'/13 réponses</span>');
  if(!g) c.push('<span class="chip">Géoloc non demandée</span>');
  else if(g.granted&&g.lat!=null) c.push('<span class="chip chip--ok">Géoloc acceptée</span>');
  else c.push('<span class="chip chip--warn">Géoloc refusée</span>');
  return c.join('');
}

function ouvrir(html,titre){

  o.innerHTML='<div class="modal__box"><div class="modal__h"><h2>'+titre+'</h2>'
    +'<button class="modal__x">'+ic('x')+'</button></div><div class="modal__b">'+html+'</div></div>';

  o.querySelector('.modal__x').onclick=fermer;
  o.onclick=e=>{ if(e.target===o) fermer(); };

    if(e.key==='Escape'){ fermer(); document.removeEventListener('keydown',esc2); }

function rendre(){
  const L=lots(), v=$('#vue');
  const T={dash:'Tableau de bord',diag:'Diagnostics',zyra:'Inscrits Zyra',bgh:'Inscrits BGH Party',
           mails:'Tous les e-mails',visites:'Visites du site',histo:'Historique',reglages:'Réglages'};
  $('#titre').textContent=T[vue]||''; $('#pt').textContent=T[vue]||'';
  v.classList.remove('swap'); void v.offsetWidth; v.classList.add('swap');

  if(vue==='dash'){    v.innerHTML=pDash(L);    return lier(); }
  if(vue==='mails'){   v.innerHTML=pMails();    return lier(); }
  if(vue==='visites'){ v.innerHTML=pVisites();  return lier(); }
  if(vue==='histo'){   v.innerHTML=pHisto();    return lier(); }
  if(vue==='reglages'){v.innerHTML=pReglages(); return lier(); }

  let liste, suivi=true;
  if(vue==='zyra'){ liste=L.zyra; suivi=false; }

  liste=liste.filter(l=>match(l,recherche));

  const tabs=suivi?'<div class="tabs">'
    +[['tous','Toutes'],['a_faire','À recontacter'],['en_cours','En cours'],['fait','Fait']]
      .map(p=>'<button data-f="'+p[0]+'" class="'+(filtre===p[0]?'on':'')+'">'+p[1]+'</button>').join('')+'</div>':'';
  v.innerHTML=tabs+(liste.length?liste.map(l=>ligne(l,{suivi:suivi})).join('')
    :'<div class="vide">Aucune fiche'+(recherche?' pour « '+esc(recherche)+' »':'')+'.</div>');
  lier();
}

const EVT={inscription:'Inscription',debut_diag:'Diagnostic commencé',email_saisi:'E-mail saisi',
  progression:'Réponse enregistrée',diag_termine:'Diagnostic terminé',paiement_lance:'Paiement lancé',

function courbe(nb){
  const V=D.visites||[], pts=[];
  for(let i=nb-1;i>=0;i--){
    const d=new Date(); d.setDate(d.getDate()-i);
    const iso=d.toISOString().slice(0,10);
    const r=V.find(x=>x.visit_date===iso);
    pts.push({val:r?(r.count||0):0,lbl:d.toLocaleDateString('fr-FR',{weekday:'short',day:'numeric'})});
  }
  if(!pts.some(p=>p.val)) return '<div class="vide">Aucune visite sur la période.</div>';
  const W=680,H=190,mx=32,my=24, max=Math.max.apply(null,pts.map(p=>p.val).concat([1]));
  const X=i=>mx+i*((W-mx*2)/Math.max(pts.length-1,1)), Y=v=>H-my-(v/max)*(H-my*2);
  const l=pts.map((p,i)=>(i?'L':'M')+X(i).toFixed(1)+','+Y(p.val).toFixed(1)).join(' ');
  return '<div style="overflow-x:auto;"><svg viewBox="0 0 '+W+' '+(H+24)+'" style="width:100%;min-width:400px;display:block;">'
    +'<defs><linearGradient id="gg" x1="0" y1="0" x2="0" y2="1">'
    +'<stop offset="0%" stop-color="#5f9cfd" stop-opacity=".3"/><stop offset="100%" stop-color="#5f9cfd" stop-opacity="0"/></linearGradient></defs>'
    +[0,.5,1].map(f=>{const y=Y(max*f);
      return '<line x1="'+mx+'" y1="'+y+'" x2="'+(W-mx)+'" y2="'+y+'" stroke="currentColor" opacity=".12"/>'
        +'<text x="'+(mx-6)+'" y="'+(y+4)+'" text-anchor="end" font-size="9" fill="currentColor" opacity=".5">'+Math.round(max*f)+'</text>';}).join('')
    +'<path d="'+l+' L'+X(pts.length-1).toFixed(1)+','+(H-my)+' L'+X(0).toFixed(1)+','+(H-my)+' Z" fill="url(#gg)"/>'
    +'<path d="'+l+'" fill="none" stroke="#5f9cfd" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>'
    +pts.map((p,i)=>'<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(p.val).toFixed(1)+'" r="3.6" fill="#5f9cfd"/>'
      +'<text x="'+X(i).toFixed(1)+'" y="'+(Y(p.val)-10).toFixed(1)+'" text-anchor="middle" font-size="10" font-weight="700" fill="currentColor">'+p.val+'</text>'
      +'<text x="'+X(i).toFixed(1)+'" y="'+(H+14)+'" text-anchor="middle" font-size="9" fill="currentColor" opacity=".5">'+esc(p.lbl)+'</text>').join('')
    +'</svg></div>';
}

async function purger(){
  const v=D.visiteurs||[]; if(v.length<=400) return 0;
  const vx=v.slice().sort((a,b)=>String(a.created_at||'').localeCompare(String(b.created_at||''))).slice(0,200);
  let n=0;
  for(let i=0;i<vx.length;i++){ try{ await api('visitors?id=eq.'+encodeURIComponent(vx[i].id),{method:'DELETE'}); n++; }catch(e){} }
  return n;
}

function copier(t,b){
  const ok=()=>{ const a=b.innerHTML; b.innerHTML=ic('check')+' Copié'; setTimeout(()=>b.innerHTML=a,1400); };
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(ok,()=>prompt('Copie manuelle :',t));
  else prompt('Copie manuelle :',t);
}
const AIDE="Échec.\n\nSi le message parle d'une fonction ou d'une colonne manquante, la mise à jour de la base n'a pas encore été appliquée.\n\n";

function lier(){
  const v=$('#vue');
  v.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{ filtre=b.dataset.f; rendre(); });
  v.querySelectorAll('[data-go]').forEach(b=>{ if(b.dataset.go) b.onclick=e=>{ e.stopPropagation(); vue=b.dataset.go; menu(); rendre(); }; });
  v.querySelectorAll('.js-copy').forEach(b=>b.onclick=e=>{ e.stopPropagation(); copier(b.dataset.m,b); });
  const ca=v.querySelector('#cpall');
  if(ca) ca.onclick=()=>copier(mails().map(m=>m.email).join(', '),ca);

  /* Le fond de la fiche ouvre le détail — les boutons et la note gardent
     leur action grâce à stopPropagation. */
  v.querySelectorAll('.js-open').forEach(function(r){
    r.onclick=function(e){
      if(e.target.closest('button,textarea,a,input')) return;
      if(r.dataset.kind==='visiteur'){
        const x=(D.visiteurs||[]).find(z=>String(z.id)===r.dataset.id); if(x) detailVisiteur(x);
      } else {
        const x=(D.leads||[]).find(z=>String(z.id)===r.dataset.id); if(x) detailLead(x);
      }
    };
  });
  v.querySelectorAll('.js-note').forEach(t=>t.onclick=e=>e.stopPropagation());

  v.querySelectorAll('.js-st').forEach(b=>b.onclick=async e=>{
    e.stopPropagation(); b.disabled=true;
    try{ await rpc('rn_set_suivi',{p_lead_id:b.dataset.id,p_statut:b.dataset.s,p_note:null});
      const l=D.leads.find(x=>x.id===b.dataset.id); if(l) l.suivi_statut=b.dataset.s;
      menu(); rendre();
    }catch(err){ alert(AIDE+err.message); b.disabled=false; }
  });

  v.querySelectorAll('.js-save').forEach(b=>b.onclick=async e=>{
    e.stopPropagation();
    const t=v.querySelector('.js-note[data-id="'+b.dataset.id+'"]'); if(!t) return;
    const a=b.innerHTML; b.innerHTML='…'; b.disabled=true;
    try{ await rpc('rn_set_suivi',{p_lead_id:b.dataset.id,p_statut:null,p_note:t.value});
      const l=D.leads.find(x=>x.id===b.dataset.id); if(l) l.suivi_note=t.value;
      b.innerHTML=ic('check')+' Enregistré';
      setTimeout(()=>{ b.innerHTML=a; b.disabled=false; },1400);
    }catch(err){ alert(AIDE+err.message); b.innerHTML=a; b.disabled=false; }
  });

  v.querySelectorAll('.js-del').forEach(b=>b.onclick=async e=>{
    e.stopPropagation();
    if(!confirm('Supprimer définitivement la fiche de '+(b.dataset.m||'ce contact')+' ?\n\nCette action est irréversible.')) return;
    try{ await api('diag_leads?id=eq.'+encodeURIComponent(b.dataset.id),{method:'DELETE'});
      D.leads=D.leads.filter(x=>x.id!==b.dataset.id); menu(); rendre();
    }catch(err){ alert('Suppression impossible : '+err.message); }
  });

  v.querySelectorAll('.js-delmail').forEach(b=>b.onclick=async e=>{
    e.stopPropagation();
    const ids=(b.dataset.ids||'').split(',').filter(Boolean);
    if(!confirm('Supprimer '+b.dataset.m+' ?\n\n'+ids.length+' fiche(s) liée(s) seront supprimées définitivement.')) return;
    try{ for(let i=0;i<ids.length;i++) await api('diag_leads?id=eq.'+encodeURIComponent(ids[i]),{method:'DELETE'});
      D.leads=D.leads.filter(x=>ids.indexOf(x.id)<0); menu(); rendre();
    }catch(err){ alert('Suppression impossible : '+err.message); }
  });

  const pt=v.querySelector('#ptg');
  if(pt){
    const peindre=()=>{ const on=purgeOn();
      pt.innerHTML=(on?ic('check'):ic('x'))+(on?' Activée — cliquer pour désactiver':' Désactivée — cliquer pour activer');
      pt.className='btn'+(on?' btn--danger':''); };
    peindre();
    pt.onclick=async()=>{
      const on=purgeOn();
      if(!on&&!confirm("Activer l'auto-purge ?\n\nLes 200 visiteurs les plus anciens seront supprimés maintenant.\nLe compteur de visites totales n'est pas touché.")) return;
      try{ localStorage.setItem(PURGE,on?'0':'1'); }catch(e){}
      if(!on){ pt.innerHTML='Purge en cours…'; const n=await purger(); await charger(); alert(n+' visiteur(s) supprimé(s).'); return; }
      peindre();
    };
  }
  /* Flèches de la rangée de compteurs. Elles ne se montrent que si la rangée
     dépasse vraiment — sur un écran large où les onze anneaux tiennent, elles
     n'auraient rien à faire. Un défilement d'environ trois anneaux par appui. */
  const rail=v.querySelector('#rings'), fG=v.querySelector('#ringG'), fD=v.querySelector('#ringD');
  if(rail&&fG&&fD){
    const peindre=()=>{
      const trop=rail.scrollWidth - rail.clientWidth;
      fG.classList.toggle('on', trop>4); fD.classList.toggle('on', trop>4);
      fG.disabled = rail.scrollLeft <= 2;
      fD.disabled = rail.scrollLeft >= trop - 2;
    };
    const pas=()=>Math.max(rail.clientWidth*0.8, 180);
    fG.onclick=()=>{ rail.scrollLeft -= pas(); };
    fD.onclick=()=>{ rail.scrollLeft += pas(); };
    rail.addEventListener('scroll', peindre, {passive:true});
    addEventListener('resize', peindre);
    peindre();
    // Les polices peuvent finir de charger après coup et changer les largeurs.
    setTimeout(peindre, 300);
  }

  const cs=v.querySelector('#cfg-s');
  if(cs) cs.onclick=async function(){
    const r=v.querySelector('#cfg-r'), a=cs.innerHTML;
    cs.innerHTML='…'; cs.disabled=true; r.textContent='';
    try{
      await ecrireConfig(v.querySelector('#cfg-p').value, v.querySelector('#cfg-l').value);
      r.style.color='var(--green)';
      r.textContent='Enregistré. Le site affiche et facture désormais '+CFG.price+' € — rechargez la page publique pour le constater.';
      cs.innerHTML=ic('check')+' Enregistré';
      setTimeout(function(){ cs.innerHTML=a; cs.disabled=false; },1600);
    }catch(e){
      r.style.color='var(--red)'; r.textContent='Échec : '+e.message;
      cs.innerHTML=a; cs.disabled=false;
    }
  };

  const tb=v.querySelector('#thb');
  if(tb){ tb.innerHTML=(theme()==='nuit'?ic('soleil')+' Passer en mode jour':ic('lune')+' Passer en mode nuit');
    tb.onclick=()=>{ bascThème(); rendre(); }; }
}

/* ── Thème ──────────────────────────────────────────────────────────────── */
const theme=()=>document.documentElement.getAttribute('data-theme');
function poseThème(t){
  document.documentElement.setAttribute('data-theme',t);
  try{ localStorage.setItem('rn_theme',t); }catch(e){}
  $('#theme').innerHTML=(t==='nuit'?ic('soleil'):ic('lune'));
}
const bascThème=()=>poseThème(theme()==='nuit'?'jour':'nuit');

/* ── Barre latérale ─────────────────────────────────────────────────────── */
const basculer=()=>document.body.classList.toggle('is-open');
$('#grip').onclick=basculer;
$('#burger').onclick=basculer;
$('#refresh').onclick=charger;
$('#theme').onclick=bascThème;
$('#site').onclick=()=>location.href='index.html';
$('#q').oninput=e=>{ recherche=e.target.value; rendre(); };

$('#gripIco').innerHTML=ic('menu');
$('#burger').innerHTML=ic('menu');
$('#refresh').innerHTML=ic('refresh');
$('#site').innerHTML=ic('power');
(function(){ let t='jour'; try{ t=localStorage.getItem('rn_theme')||'jour'; }catch(e){} poseThème(t); })();

function entrer(){
  if(CODES.indexOf($('#gp').value.trim())<0){
    $('#ge').textContent='Code incorrect.';
    setTimeout(()=>{ const e=$('#ge'); if(e) e.textContent=''; },1800);
    return;
  }
  $('#gate').remove();
  charger();   // la barre reste fermée à l'arrivée
}
$('#gg').onclick=entrer;
$('#gp').onkeydown=e=>{ if(e.key==='Enter') entrer(); };
setTimeout(()=>$('#gp').focus(),100);
</script>
</body>
