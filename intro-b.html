<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Renaissance — Intro (B)</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  :root{--blue:#3d6bff;--cyan:#57e0ff;--violet:#9a6bff;--ink:#eaf0ff;}
  html,body{height:100%;overflow:hidden;background:#03040c;color:var(--ink);
    font-family:system-ui,-apple-system,'Segoe UI',sans-serif;cursor:default;}
  #galaxy{position:fixed;inset:0;z-index:0;display:block;}
  .vignette{position:fixed;inset:0;z-index:1;pointer-events:none;
    background:radial-gradient(ellipse 70% 60% at 50% 42%,transparent 40%,rgba(3,4,12,.65) 100%);}
  .stage{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:26px;perspective:1000px;padding:24px;}
  /* ── R cristal ── */
  .r-wrap{position:relative;width:min(60vw,300px);aspect-ratio:1;transform-style:preserve-3d;
    filter:drop-shadow(0 20px 60px rgba(61,107,255,.5));will-change:transform;}
  .r-logo{width:100%;height:100%;overflow:visible;}
  .r-logo path{stroke:url(#rg);stroke-width:8;fill:none;stroke-linecap:round;stroke-linejoin:round;
    filter:url(#glow);}
  .r-shine{stroke:#ffffff;stroke-width:2.2;opacity:.85;mix-blend-mode:screen;
    stroke-dasharray:60 300;animation:shine 4.5s linear infinite;}
  @keyframes shine{to{stroke-dashoffset:-360;}}
  /* billes flottantes */
  .ball{position:absolute;border-radius:50%;pointer-events:none;
    background:radial-gradient(circle at 35% 30%,#ffffff 0%,var(--cyan) 30%,var(--blue) 70%,transparent 100%);
    filter:blur(.4px) drop-shadow(0 0 10px rgba(87,224,255,.7));opacity:.9;}
  .b1{width:26px;height:26px;top:18%;left:60%;animation:fl 6s ease-in-out infinite;}
  .b2{width:16px;height:16px;top:52%;left:30%;animation:fl 7.5s ease-in-out infinite reverse;}
  .b3{width:12px;height:12px;top:70%;left:66%;animation:fl 5.5s ease-in-out infinite;}
  .b4{width:20px;height:20px;top:33%;left:24%;animation:fl 8.5s ease-in-out infinite reverse;}
  .b5{width:9px;height:9px;top:80%;left:44%;animation:fl 6.8s ease-in-out infinite;}
  @keyframes fl{0%,100%{transform:translate3d(0,0,30px);}50%{transform:translate3d(6px,-16px,60px);}}
  /* ── Texte + CTA ── */
  .brand{font-weight:800;letter-spacing:.42em;text-indent:.42em;font-size:clamp(20px,5.5vw,34px);
    background:linear-gradient(90deg,#fff,var(--cyan),#fff);-webkit-background-clip:text;background-clip:text;color:transparent;
    opacity:0;}
  .sub{font-size:12px;letter-spacing:.34em;color:#7f8bbf;text-transform:uppercase;opacity:0;margin-top:-14px;}
  .cta-diag{margin-top:8px;padding:16px 34px;border:none;border-radius:40px;cursor:pointer;
    font-size:15px;font-weight:700;letter-spacing:.02em;color:#03040c;
    background:linear-gradient(135deg,var(--cyan),var(--blue));
    box-shadow:0 0 0 1px rgba(255,255,255,.2),0 14px 40px rgba(61,107,255,.55);
    opacity:0;transition:transform .25s ease,box-shadow .3s ease;}
  .cta-diag:hover{transform:translateY(-2px);box-shadow:0 0 0 1px rgba(255,255,255,.3),0 18px 54px rgba(87,224,255,.7);}
  .cta-diag:active{transform:translateY(0) scale(.98);}
  /* ── Transition "dimension" ── */
  .warp{position:fixed;inset:0;z-index:5;pointer-events:none;opacity:0;
    background:radial-gradient(circle at 50% 46%,#fff 0%,var(--cyan) 12%,var(--blue) 34%,#03040c 70%);}
  .hint{position:fixed;bottom:18px;left:0;right:0;text-align:center;z-index:3;font-size:11px;letter-spacing:2px;color:#4a5384;}
</style>
<link rel="stylesheet" href="assets/redesign-v2.css?v=1">
</head>
<body>
<canvas id="galaxy"></canvas>
<div class="vignette"></div>

<div class="stage">
  <div class="r-wrap" id="rwrap">
    <svg class="r-logo" viewBox="0 0 100 100" aria-label="Renaissance">
      <defs>
        <linearGradient id="rg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#57e0ff"/>
          <stop offset="0.5" stop-color="#3d6bff"/>
          <stop offset="1" stop-color="#9a6bff"/>
        </linearGradient>
        <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
          <feGaussianBlur stdDeviation="2.4" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      <path d="M16.5 90L16.5 10L58 10Q85 10 85 24Q85 35.5 58 35.5L38 35.5L63 81"/>
      <path class="r-shine" d="M16.5 90L16.5 10L58 10Q85 10 85 24Q85 35.5 58 35.5L38 35.5L63 81"/>
    </svg>
    <span class="ball b1"></span><span class="ball b2"></span><span class="ball b3"></span>
    <span class="ball b4"></span><span class="ball b5"></span>
  </div>

  <div class="brand">RENAISSANCE</div>
  <div class="sub">Discipline · Ambition · Impact</div>
  <button class="cta-diag" id="cta">Diagnostic Gratuit</button>
</div>

<div class="warp" id="warp"></div>
<div class="hint">Bouge la souris / le doigt · clique « Diagnostic Gratuit »</div>

<script src="assets/vendor/gsap.min.js"></script>
<script>
/* ── Galaxie 2D (étoiles + parallax souris) ── */
(function(){
  const cv=document.getElementById('galaxy'), ctx=cv.getContext('2d');
  let W,H,DPR=Math.min(devicePixelRatio||1,2),stars=[],neb=[];
  const mouse={x:0,y:0,tx:0,ty:0};
  function resize(){W=cv.width=innerWidth*DPR;H=cv.height=innerHeight*DPR;cv.style.width=innerWidth+'px';cv.style.height=innerHeight+'px';}
  resize();addEventListener('resize',resize,{passive:true});
  function mk(n){stars=[];for(let i=0;i<n;i++)stars.push({x:Math.random()*W,y:Math.random()*H,z:Math.random()*.9+.1,r:(Math.random()*1.4+.3)*DPR,tw:Math.random()*Math.PI*2,c:Math.random()<.2?'135,224,255':(Math.random()<.5?'170,190,255':'255,255,255')});}
  mk(Math.round((innerWidth*innerHeight)/2600));
  neb=[{x:.34,y:.4,r:.5,c:'61,107,255'},{x:.66,y:.55,r:.42,c:'154,107,255'},{x:.5,y:.3,r:.32,c:'87,224,255'}];
  addEventListener('pointermove',e=>{mouse.tx=(e.clientX/innerWidth-.5);mouse.ty=(e.clientY/innerHeight-.5);},{passive:true});
  let t=0;
  function draw(){
    t+=.016;mouse.x+=(mouse.tx-mouse.x)*.05;mouse.y+=(mouse.ty-mouse.y)*.05;
    ctx.clearRect(0,0,W,H);
    // nébuleuses
    for(const n of neb){const cx=(n.x-mouse.x*.06)*W,cy=(n.y-mouse.y*.06)*H,rad=n.r*Math.max(W,H);
      const g=ctx.createRadialGradient(cx,cy,0,cx,cy,rad);g.addColorStop(0,`rgba(${n.c},.16)`);g.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=g;ctx.fillRect(0,0,W,H);}
    // étoiles
    for(const s of stars){const px=s.x-mouse.x*90*DPR*s.z,py=s.y-mouse.y*90*DPR*s.z;
      const a=.5+.5*Math.sin(t*2+s.tw);
      ctx.beginPath();ctx.arc(px,py,s.r*(.7+.5*s.z),0,6.283);ctx.fillStyle=`rgba(${s.c},${.35+a*.5*s.z})`;ctx.fill();}
    requestAnimationFrame(draw);
  }
  draw();
})();

/* ── R : tilt 3D vers la souris ── */
(function(){
  const rw=document.getElementById('rwrap');let rx=0,ry=0,tx=0,ty=0;
  addEventListener('pointermove',e=>{tx=(e.clientX/innerWidth-.5);ty=(e.clientY/innerHeight-.5);},{passive:true});
  (function upd(){rx+=(ty-rx)*.06;ry+=(tx-ry)*.06;
    rw.style.transform=`rotateX(${-rx*26}deg) rotateY(${ry*32}deg)`;requestAnimationFrame(upd);})();
})();

/* ── Entrée (GSAP) ── */
window.addEventListener('load',()=>{
  if(!window.gsap)return;
  gsap.set('.r-wrap',{scale:.6,opacity:0});
  const tl=gsap.timeline({defaults:{ease:'power3.out'}});
  tl.to('.r-wrap',{scale:1,opacity:1,duration:1.2})
    .to('.brand',{opacity:1,y:0,duration:.7},'-=.5')
    .to('.sub',{opacity:1,duration:.6},'-=.4')
    .to('#cta',{opacity:1,y:0,duration:.6},'-=.35');
});

/* ── Clic « Diagnostic Gratuit » → transition dimension ── */
document.getElementById('cta').addEventListener('click',()=>{
  const warp=document.getElementById('warp');
  if(!window.gsap){location.hash='#diagnostic';return;}
  const tl=gsap.timeline();
  tl.to('.r-wrap',{scale:2.4,rotateY:180,duration:.9,ease:'power2.in'},0)
    .to(['.brand','.sub','#cta','.hint'],{opacity:0,duration:.4},0)
    .to(warp,{opacity:1,duration:.7,ease:'power2.in'},.2)
    .add(()=>{ /* Ici : ouvre le diagnostic (funnel) sur le vrai site */ })
    .to(warp,{opacity:0,duration:.8,ease:'power2.out'},'+=.15')
    .fromTo('.r-wrap',{scale:2.4},{scale:1,rotateY:360,duration:1,ease:'power3.out'},'-=.6')
    .to(['.brand','.sub','#cta','.hint'],{opacity:1,duration:.5},'-=.4');
});
</script>
<script src="assets/vendor/ScrollTrigger.min.js" defer></script>
<script src="assets/vendor/lenis.min.js" defer></script>
<script src="assets/redesign-v2.js?v=1" defer></script>
</body>
</html>
