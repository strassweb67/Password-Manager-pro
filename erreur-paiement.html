<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Paiement non abouti — Renaissance</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  :root{--accent:#5a78ff;--accent2:#8ea6ff;--err:#ef4444;}
  html,body{height:100%;}
  body{
    font-family:Inter,system-ui,-apple-system,sans-serif;
    background:radial-gradient(ellipse 90% 60% at 50% 0%,#2a1020 0%,#05060c 60%),#03040c;
    color:#eef3ff;min-height:100%;display:flex;align-items:center;justify-content:center;
    padding:24px;overflow-x:hidden;position:relative;
  }
  body::before{content:'';position:fixed;width:620px;height:620px;top:-240px;left:-180px;border-radius:50%;
    background:radial-gradient(circle,rgba(214,47,70,.20),transparent 65%);pointer-events:none;}
  body::after{content:'';position:fixed;width:540px;height:540px;bottom:-220px;right:-160px;border-radius:50%;
    background:radial-gradient(circle,rgba(90,120,255,.14),transparent 65%);pointer-events:none;}
  .card{
    position:relative;z-index:1;max-width:480px;width:100%;text-align:center;
    background:rgba(12,13,24,.86);border:1px solid rgba(239,68,68,.32);border-radius:22px;
    padding:44px 30px 36px;box-shadow:0 30px 90px rgba(0,0,0,.75);backdrop-filter:blur(8px);
  }
  .x{
    width:88px;height:88px;margin:0 auto 22px;border-radius:50%;
    background:radial-gradient(circle at 50% 40%,rgba(239,68,68,.26),rgba(239,68,68,.06));
    border:1.5px solid rgba(239,68,68,.6);display:flex;align-items:center;justify-content:center;
    box-shadow:0 0 0 6px rgba(239,68,68,.05),0 12px 30px rgba(150,20,30,.35);
    animation:pop .5s cubic-bezier(.34,1.56,.64,1) both;
  }
  .x svg{width:42px;height:42px;stroke:#f87171;stroke-width:3.4;fill:none;stroke-linecap:round;}
  @keyframes pop{0%{transform:scale(.5);opacity:0;}100%{transform:scale(1);opacity:1;}}
  .kick{font-family:'Archivo',system-ui,sans-serif;font-size:.68rem;letter-spacing:.22em;
    text-transform:uppercase;color:var(--err);font-weight:800;margin-bottom:12px;}
  h1{font-family:'Archivo',system-ui,sans-serif;font-size:clamp(1.6rem,6.5vw,2.1rem);
    line-height:1.12;letter-spacing:.01em;color:#fff;margin-bottom:12px;}
  p{font-size:.95rem;line-height:1.7;color:#cbd6ee;margin-bottom:10px;}
  .sub{font-size:.8rem;color:#7f8db0;margin-bottom:26px;}
  .retry{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;
    padding:15px 18px;border-radius:14px;text-decoration:none;font-weight:800;font-size:15px;
    color:#fff;background:linear-gradient(135deg,#33b1f0,#229ED9);
    box-shadow:0 10px 26px rgba(34,158,217,.4);margin-bottom:12px;transition:transform .15s,box-shadow .2s;}
  .retry:hover{transform:translateY(-2px);box-shadow:0 14px 34px rgba(45,171,238,.6);}
  .retry svg{width:20px;height:20px;flex:none;}
  .home{display:block;color:#7f8db0;font-size:.82rem;text-decoration:none;margin-top:6px;padding:8px;}
  .home:hover{color:#cbd6ee;}
</style>
</head>
<body>
  <div class="card">
    <div class="x" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </div>
    <div class="kick">Paiement non abouti</div>
    <h1>Ton paiement n'a pas été validé</h1>
    <p>Aucun montant n'a été débité, ou le paiement a été interrompu. Ça arrive — tu peux réessayer tout de suite.</p>
    <p class="sub">Si le problème persiste, contacte-nous et on débloque ton accès manuellement.</p>
    <a class="retry" href="https://checkout.revolut.com/payment-link/706c5a16-d1cf-4df5-9674-db846a75acd4" id="retry-link">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8M3 22v-6h6"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/></svg>
      <span>Réessayer le paiement</span>
    </a>
    <a class="home" href="index.html">← Retour à l'accueil</a>
  </div>
</body>
</html>
